<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMA Calendar View</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Tokens from Figma: FMA Calendar frames + Mobile UI Library (variable names in comments) */
:root{
  --text-default:#141414;            /* Text/Default */
  --text-subdued:#606162;            /* Text/Subdued */
  --text-primary:#0265dc;            /* Text/Primary */
  --text-inverted:#ffffff;           /* Text/Inverted */
  --surface-default:#ffffff;         /* Surface/Default */
  --surface-grey-subdued:#f7f7f7;    /* Surface/Grey-Subdued */
  --surface-inverted:#2d2e31;        /* Surface/Inverted */
  --surface-inverted-strong:#141414; /* Surface/Inverted-Strong */
  --app-bg:#fcfcfc;                  /* App/Background */
  --app-bg-alt:#f7f7f7;              /* App/Background-Alt */
  --border-grey:#dfe0e1;             /* Border/Grey, Border/Secondary-Subdued */
  --border-grey-strong:#949596;      /* Border/Grey-Strong */
  --border-secondary:#bcbcbd;        /* Border/Secondary */
  --neutral-50:#eeeeee; --neutral-200:#444445;                  /* Color/Neutral */
  --blue-50:#e6f1ff; --blue-100:#e0f2ff; --blue-300:#70b1ff; --blue-500:#0265dc; --blue-600:#004491; --blue-800:#003472;
  --green-50:#d3fded; --green-300:#3be3a2; --green-800:#04482e;
  --yellow-50:#fffcf0; --yellow-500:#ffbe00; --yellow-800:#704b00; --yellow-400:#ffc902;
  --neutral-300:#a8a8a8; --neutral-800:#292929; --orange-50:#ffecd6; --orange-300:#ffa037; --orange-800:#4d2800; --yellow-300:#ffe278;
  --blue-900:#002047;
  --blue-200:#b5deff; --cyan-200:#b1f3fa; --border-default:#444445;
  --purple-50:#eeecf9; --purple-300:#b1a7e2; --purple-800:#2e2267; --red-50:#ffe9e5; --red-300:#ff8670; --red-800:#731100;
  --orange-100:#ffeccc; --green-100:#cef8e0; --green-600:#005132;
  --status-done:#49cc93; --orange-200:#fdd291; --surface-secondary-subdued:#eeeeee;
  --surface-critical:#e13212; --text-on-critical:#fff; --text-critical-strong:#bf2a00;
  --green-500:#007a4d; --text-critical:#e13212; --warning-subdued:#fff9e2; --border-warning-subdued:#fff0b1; --purple-200:#c1b6f2; --yellow-300:#ffe278;
  --ios-fill-3:rgba(118,118,128,.12); --ios-label-2:rgba(60,60,67,.6); --ios-pulldown:rgba(60,60,67,.33); --ios-overlay-thick:rgba(253,253,253,.92);
  --surface-secondary-alt:rgba(0,0,0,.06);   /* Surface/Secondary Alt */
  --cyan-400:#08bfdf; --blue-grey-100:#eaeff2; --blue-grey-500:#55768e; --blue-grey-700:#344856;
  --shadow-3:0 8px 24px rgba(20,20,20,.1);                                   /* Shadow/3 */
  --elev-6dp:0 3px 5px rgba(0,0,0,.2),0 1px 18px rgba(0,0,0,.12),0 6px 10px rgba(0,0,0,.14); /* 6dp Elevation */
  --font-base:"SF Pro",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-body:"Nunito Sans","SF Pro",-apple-system,system-ui,sans-serif;
  --fs-100:10px; --fs-xs:12px; --fs-sm:14px; --fs-md:16px;                   /* Typography sizes */
  --eyebrow-ls:.7px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; /* Spacing scale used in frames */
  --hour:71px;                       /* row pitch of the Hours stack (56 gap + 15 label) */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--app-bg-alt);font-family:var(--font-base);color:var(--text-default);display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg{display:block;flex:none}

.device{position:relative;flex:none;padding:12px;border-radius:62px;background:linear-gradient(145deg,#2b2b2f 0%,#0d0d0f 45%,#1c1c1f 100%);box-shadow:inset 0 0 0 1.5px #5a5a5f,inset 0 0 0 4px #0a0a0b,0 30px 70px rgba(20,20,20,.28),0 6px 16px rgba(20,20,20,.18)}
.device::before{content:'';position:absolute;left:-3px;top:118px;width:3px;height:30px;border-radius:2px 0 0 2px;background:#2b2b2f;box-shadow:0 52px 0 0 #2b2b2f,0 106px 0 0 #2b2b2f;pointer-events:none}
.device::after{content:'';position:absolute;right:-3px;top:184px;width:3px;height:96px;border-radius:0 2px 2px 0;background:#2b2b2f;pointer-events:none}
.phone{position:relative;width:375px;height:812px;background:var(--app-bg);border-radius:50px;overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:60;pointer-events:none}
@media (max-width:430px){
  body{display:block}
  .device{padding:0;border-radius:0;background:none;box-shadow:none;zoom:1!important}
  .device::before,.device::after,.island{display:none}
  .phone{width:100%;height:100dvh;border-radius:0}
}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3) var(--sp-4) 0 var(--sp-6);font-size:var(--fs-md);font-weight:590;letter-spacing:-.32px;pointer-events:none}
.status .r{display:flex;gap:var(--sp-1);align-items:center}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app-bg);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
#job{transform:translateX(100%);z-index:10}
#job.open{transform:none}

/* header */
.hdr{flex:none;background:var(--surface-default);border-bottom:1px solid var(--border-grey);padding-top:44px;z-index:3}
.nav{height:44px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:var(--fs-md);line-height:1.25}
.nav .ic{position:absolute;top:0;height:44px;display:grid;place-items:center;padding:0 var(--sp-2)}

.cal-head{flex:none;background:var(--surface-default);display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-2) 0 0;z-index:2}
.toolbar{display:flex;align-items:center;justify-content:space-between;height:34px;padding:var(--sp-1) var(--sp-4)}
.tl-left{display:flex;align-items:center;gap:var(--sp-1);height:100%}
.vbtn{display:flex;align-items:center;padding:var(--sp-2) var(--sp-2) var(--sp-2) 0}
.mbtn{display:flex;align-items:center;gap:var(--sp-1);height:100%;font-size:var(--fs-sm);font-weight:700;line-height:1.25}
.tl-right{display:flex;align-items:center;gap:var(--sp-2)}
.todaybtn{width:34px;height:34px;border-radius:50px;background:var(--surface-secondary-alt);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700}
.daytitle{font-size:var(--fs-md);font-weight:700;line-height:1.25}
.toggle{display:flex}
.toggle button{display:grid;place-items:center;padding:var(--sp-2) var(--sp-4);border:1px solid var(--border-grey-strong);border-right:0;background:var(--surface-default)}
.toggle button:first-child{border-radius:50px 0 0 50px}
.toggle button:last-child{border-radius:0 50px 50px 0;border:0;background:var(--surface-inverted-strong);color:var(--text-inverted)}

/* date strip */
.strip{display:flex;gap:var(--sp-4);justify-content:center;overflow:hidden}
.strip.gut{justify-content:flex-start;gap:0;padding:0 var(--sp-3) 0 51px}
.strip.gut .d{flex:1}
.d{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.d .wk{height:20px;padding:2px;display:grid;place-items:center;font-size:var(--fs-100);font-weight:700;letter-spacing:var(--eyebrow-ls);text-transform:uppercase;line-height:1.5}
.d .n{width:32px;height:32px;border-radius:8px;background:var(--surface-grey-subdued);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp-1) 6px;gap:2px;font-size:var(--fs-xs);font-weight:700;line-height:1.25}
.d.sel .n{background:var(--surface-inverted);color:var(--text-inverted)}
.d.dim{opacity:.5}
.busy{display:flex;gap:2px;height:6px}
.busy i{width:6px;height:6px;border-radius:50%;background:var(--blue-500)}
.d.sel .busy i{background:var(--text-inverted)}
.strip.plain .n{background:none}
.strip.plain .d.sel .n{background:var(--surface-inverted)}
.cal-head.bb{border-bottom:1px solid var(--border-grey);padding-bottom:var(--sp-2)}

.refreshed{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4);font-family:var(--font-body);font-size:var(--fs-xs);line-height:1.5;color:var(--text-subdued)}

/* month picker (expanded from the month dropdown) */
.picker{overflow:hidden;max-height:0;transition:max-height .28s ease}
.picker.open{max-height:420px}
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 var(--sp-4);row-gap:var(--sp-1)}
.pgrid .h{text-align:center;font-size:var(--fs-100);font-weight:700;letter-spacing:var(--eyebrow-ls);color:var(--text-default);padding:var(--sp-1) 0 var(--sp-2)}
.pgrid button{height:44px;display:flex;justify-content:center;align-items:flex-start}
.pgrid button>span{width:34px;min-height:36px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:var(--sp-1);font-size:var(--fs-sm);font-weight:700;line-height:1.25}
.pgrid button.sel>span{background:var(--surface-inverted);color:var(--text-inverted)}
.pgrid button.sel .busy i{background:var(--text-inverted)}
.pgrid button.out{visibility:hidden}
.busy b{font-size:var(--fs-100);line-height:6px;font-weight:700;margin-left:1px}
.picker.monly .pgrid{display:none}
.pills{display:flex;gap:var(--sp-2);overflow-x:auto;padding:var(--sp-2) var(--sp-4) var(--sp-3);scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:28px;padding:0 var(--sp-3);border-radius:50px;background:var(--surface-secondary-alt);font-size:var(--fs-xs);font-weight:590;display:flex;align-items:center;gap:var(--sp-1)}
.pill.on,.pill.year{background:var(--surface-inverted-strong);color:var(--text-inverted)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y;background:var(--app-bg);user-select:none;-webkit-user-select:none}
.dpage{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app-bg);will-change:transform}
.dpage.anim{transition:transform .26s cubic-bezier(.25,.8,.25,1)}
.dhead{flex:none;background:var(--surface-default);border-bottom:1px solid var(--border-grey);padding:var(--sp-2) 0;display:flex;flex-direction:column;gap:var(--sp-2)}
.dhead .daytitle{padding:var(--sp-2) var(--sp-4)}
.cal{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background:var(--app-bg);scrollbar-width:none}
.cal::-webkit-scrollbar{display:none}

/* timeline */
.tl{position:relative}
.hr{position:absolute;left:0;right:0;display:flex;align-items:center;gap:2px;padding-left:var(--sp-3);transform:translateY(-50%)}
.hr b{width:34px;flex:none;white-space:nowrap;font-size:var(--fs-100);font-weight:700;letter-spacing:var(--eyebrow-ls);line-height:1.5;color:var(--text-subdued);text-transform:uppercase}
.hr i{flex:1;height:1px;background:var(--border-grey)}
.hr.strong i{background:var(--border-secondary)}
.cols{position:absolute;top:0;bottom:0}
.col{position:absolute;top:0;bottom:0;border-left:1px solid var(--border-grey)}
.cols.multi .col:last-child{border-right:1px solid var(--border-grey)}

.ev{position:absolute;overflow:hidden;color:var(--ink-c);background:var(--bg-c);text-align:left}
/* full job card (day view) */
.card{border-radius:12px;padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);touch-action:pan-y}
.card.tight{padding-top:var(--sp-1);padding-bottom:var(--sp-1);gap:var(--sp-2)}
.card.line{border:1px solid var(--bd-c)}
.card.line .bar{left:-1px;top:-1px;bottom:-1px}
.card.strike .ttl>span:not(.dotsb){text-decoration:line-through}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--bar-c)}
.card .ttl{display:flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-xs);font-weight:700;line-height:1.25;min-height:20px}
.card .ttl>span:not(.dotsb){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row{display:flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-xs);font-weight:590;line-height:12px;color:var(--text-default)}
.card .row.link{color:var(--text-primary)}
.card .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .info{display:flex;flex-direction:column;gap:var(--sp-1)}
.card.tight .info{gap:0}
.card.line{border:1px solid var(--bd-c)}
.card.break{border-radius:12px;padding:var(--sp-1) var(--sp-2) 2px var(--sp-4);flex-direction:row;align-items:flex-start;color:var(--text-inverted)}
.tags{display:flex;gap:var(--sp-2);height:20px;align-items:center}
.chip{display:inline-flex;align-items:center;padding:2px 5px;border-radius:24px;border:1px solid var(--border-grey);font-size:var(--fs-xs);font-weight:590;line-height:16px;color:var(--text-default);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.badge{background:var(--blue-grey-100);border-radius:16px;padding:0 6px;min-height:18px;line-height:12px}
/* compact blocks (3-day / week) */
.blk{border-radius:2px;padding:2px var(--sp-1);font-size:var(--fs-xs);font-weight:700;line-height:1.25;overflow:hidden;word-break:break-word;color:var(--ink-c);background:var(--bg-c)}
.blk.line{box-shadow:inset 0 0 0 1px var(--bd-c)}
.blk{display:flex;align-items:flex-start;justify-content:flex-start;text-align:left}
.blk .t{min-width:0;width:100%}
.blk.wk{padding:2px;border-radius:2px}
.blk.wk .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-word}

.nowline{position:absolute;left:var(--sp-2);right:0;height:0;z-index:3;pointer-events:none;display:flex;align-items:center}
.nowline i{font-style:normal;background:var(--blue-600);color:var(--text-inverted);font-size:var(--fs-100);font-weight:700;letter-spacing:var(--eyebrow-ls);line-height:1.5;padding:1px var(--sp-1);border-radius:100px;transform:translateY(0);flex:none}
.nowline u{flex:1;border-top:2px dotted var(--blue-600)}
.nowline.dot i{width:12px;height:12px;padding:0;border-radius:50%}

/* month grid */
.month{margin:var(--sp-2);padding:var(--sp-2);background:var(--surface-default);border-radius:12px}
.month .mhd,.month .wkr{display:grid;grid-template-columns:repeat(7,1fr)}
.month .mhd div{text-align:center;font-size:var(--fs-100);font-weight:700;letter-spacing:var(--eyebrow-ls);color:var(--text-default);line-height:1.5;padding-bottom:var(--sp-1)}
.month .whr{height:1px;background:var(--border-grey);margin:var(--sp-1) 0}
.cell{min-height:99px;padding:0 1px;display:flex;flex-direction:column;gap:2px;align-items:stretch;overflow:hidden;position:relative}
.cell .dn{align-self:center;min-width:24px;height:20px;padding:0 var(--sp-1);border-radius:8px;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;line-height:15px;margin-bottom:1px}
.cell.blank{visibility:hidden}
.cell.today .dn{background:var(--surface-inverted);color:var(--text-inverted)}
.cell .c{height:14px;border-radius:2px;font-size:var(--fs-100);font-weight:700;line-height:14px;padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--bg-c);color:var(--ink-c)}
.cell .c.line{box-shadow:inset 0 0 0 1px var(--bd-c)}
.cell .more{align-self:center;min-width:13px;height:12px;padding:0 2px;border-radius:16px;background:var(--blue-grey-100);font-size:9px;color:var(--text-default);font-weight:600;text-align:center;line-height:12px}

.fab{position:absolute;right:var(--sp-5);bottom:99px;width:56px;height:56px;border-radius:72px;background:var(--surface-inverted-strong);color:var(--text-inverted);display:grid;place-items:center;box-shadow:var(--elev-6dp);z-index:6}
.footer{flex:none;background:var(--surface-grey-subdued);box-shadow:0 8px 12px rgba(20,20,20,.1);z-index:7;position:relative;height:83px}
.tabs{display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);padding:var(--sp-2) var(--sp-1) var(--sp-1);font-size:var(--fs-100);color:var(--text-subdued);font-weight:400}
.tabs button.on{color:var(--text-default)}
.homebar{position:absolute;bottom:var(--sp-2);left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:100px;background:var(--text-default);z-index:30;pointer-events:none}

/* action sheet */
.scrim{position:absolute;inset:0;background:rgba(20,20,20,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:21}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-default);border-radius:16px 16px 0 0;padding:var(--sp-2) 0 var(--sp-6);transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.7,.2,1);z-index:22;box-shadow:var(--shadow-3)}
.sheet.open{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--border-secondary);margin:0 auto var(--sp-2)}
.sheet h3{margin:0;padding:var(--sp-2) var(--sp-4) var(--sp-3);font-size:var(--fs-md);font-weight:700;line-height:1.25}
.sheet .opt{display:flex;align-items:center;gap:var(--sp-4);height:48px;padding:0 var(--sp-5);width:100%;font-size:var(--fs-sm);font-weight:590}
.sheet .opt .r{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border-secondary)}
.sheet .opt.on .r{border:6px solid var(--surface-inverted-strong)}
.sheet .opt:active{background:var(--surface-grey-subdued)}

/* event actions: More sheet (5675:59107) + native iOS map chooser */
.dotsb{display:grid;place-items:center;flex:none;width:24px;height:24px;margin:-2px -4px -2px 0;border-radius:50%;cursor:pointer}
.card .row span[data-act]{cursor:pointer}
.asheet{position:absolute;left:0;right:0;bottom:0;padding:0 7px var(--sp-2);z-index:22;transform:translateY(110%);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.asheet.open{transform:none}
.asheet .grp{border-radius:14px;overflow:hidden;background:rgba(244,244,247,.94);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}  /* native iOS action-sheet material */
.asheet .grp button{display:block;width:100%;height:50px;font-size:17px;line-height:50px;text-align:center;border-top:1px solid rgba(60,60,67,.18)}
.asheet .grp button:first-child{border-top:0}
.asheet .grp button:active,.asheet .cx:active{background:rgba(60,60,67,.12)}
.asheet .cx{display:block;width:100%;height:50px;margin-top:var(--sp-2);border-radius:14px;background:var(--surface-default);font-size:17px;font-weight:600;line-height:50px;text-align:center}
.asheet .hi{height:26px;position:relative}
.asheet .hi i{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:139px;height:5px;border-radius:100px;background:var(--text-default)}
#sheet .aopt .r{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--border-grey-strong);background:var(--surface-default);display:grid;place-items:center}
#sheet .aopt.on .r{border:2px solid var(--border-default)}
#sheet .aopt.on .r::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--surface-inverted-strong)}
/* long-press slot + Add sheet — Figma: 5617:86241 (Schedule slot), 5643:97279 (Add sheet) */
.slot{position:absolute;left:0;right:0;border-radius:12px;background:var(--blue-100);border:1px dashed var(--blue-500);padding:var(--sp-1) var(--sp-2) var(--sp-1) var(--sp-4);display:flex;align-items:flex-start;color:var(--blue-900);font-size:var(--fs-xs);font-weight:700;line-height:20px;z-index:2;animation:slotin .18s ease-out;pointer-events:none}
@keyframes slotin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slot{animation:none}.dpage.anim{transition:none}}
#addSheet,#moreSheet,#sheet{border-radius:10px 10px 0 0;padding:var(--sp-2) 0 34px}
#addSheet .grab,#moreSheet .grab,#sheet .grab{width:36px;height:5px;border-radius:2.5px;background:rgba(127,127,127,.4);margin:0 auto}
#addSheet .ah,#moreSheet .ah,#sheet .ah,#pickSheet .ah{position:relative;display:flex;align-items:center;justify-content:center;padding:5px var(--sp-4) var(--sp-4);border-bottom:1px solid var(--border-grey);font-size:var(--fs-md);font-weight:700;line-height:1.25}
#addSheet .ah button,#moreSheet .ah button,#sheet .ah button,#pickSheet .ah button{position:absolute;right:var(--sp-4);top:0;width:28px;height:28px;border-radius:50%;background:var(--border-grey);color:var(--text-subdued);display:grid;place-items:center}

<script>
const fitDevice=()=>{ const d=document.getElementById('device'); if(!d) return;

const DAY = 864e5;
const TODAY = new Date(2026,9,13);          // Tue Oct 13, 2026
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const START = 7, END = 19;                  // Hours stack in Figma runs 7 AM – 7 PM
const state = { view:'day', sel:new Date(TODAY), pickerOpen:false, monthPills:false };

/* ---------- data ---------- */
const PEOPLE = ['Ava Davis','Sophia Williams','Noah Johnson','Liam Carter','Mia Torres','Ethan Park','Olivia Reed'];
const ADDR = ['8502 Preston Rd, Inglewood, MN 98380','214 Lakeview Dr, Duluth, MN 55802','77 Maple Ave, Edina, MN 55424','1190 Birch St, Eagan, MN 55121'];
// card styles map to Figma tokens: bg / left bar / title ink / outline
const STYLE = {
  grey:  {bg:'--neutral-50',     bar:'--neutral-300',  ink:'--neutral-800'},
  dispatched:{bg:'--purple-50',  bar:'--purple-300',  ink:'--purple-800'},

  green: {bg:'--green-50',       bar:'--green-300',    ink:'--green-800'},
  blue:  {bg:'--blue-50',        bar:'--blue-300',     ink:'--blue-800'},
  yellow:{bg:'--yellow-50',      bar:'--yellow-300',   ink:'--yellow-800'},
  slate: {bg:'--blue-grey-500',  bar:'--blue-grey-700',ink:'--text-inverted'}

const KINDS = {
  grey:['Ventilation System Review','job'], green:['Roof Inspection & Estimate','job'], green2:['Cooling Tune Up','job'],
  blue:['Thermostat Calibration','job'], orange:['Air Conditioning Check-Up','job'], yellow:['Heating System Assessment','job'],
  slate:['Meeting with team','meet'], brk:['Breakfast','break'],
  dispatched:['Duct Cleaning Service','job'], nextjob:['Cooling Tune Up','job'], canceled:['HVAC Maintenance','job']

let uid = 0;
const FORM_DESC='Attended morning check-in meeting: align on priorities, confirm route and tasks for the day. Morning check-in completed status: reviewed daily schedule, confirmed assignments, and attended safety briefing.';
const FORMSETS={
  'Morning Check-in':{desc:FORM_DESC,forms:[

};
function mk(kind,s,e,person,title){
  const st = kind==='brk'?'slate':kind==='green2'?'green':kind;
  uid++;
  const o={id:uid,style:st,title:title||KINDS[kind][0],type:KINDS[kind][1],start:s,end:e,who:person||PEOPLE[uid%PEOPLE.length],addr:ADDR[uid%ADDR.length]};
  const fs=FORMSETS[o.title]; if(fs){ o.desc=fs.desc; o.forms=fs.forms; }
  return o;
}
const key = d => d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
const cache = {};
const JOBT=['Thermostat Calibration','Cooling Tune Up','Air Conditioning Check-Up','Heating System Assessment','Duct Cleaning Service','Roof Inspection & Estimate','Ventilation System Review'];
const SLOTS=[[7,8.5],[9,10.5],[11,12.5],[13,14.5],[15,16.5]];
/* Sample schedule rules so states make sense against "now" (Tue Oct 13, 2026, 11:35 AM):
   past days  -> Done (occasionally Cancelled) + non-job events
   today      -> Done, Pause, Working (current), Dispatched, ONE Next Job, Scheduled, Cancelled
   later days -> Scheduled (occasionally Hold or Cancelled) + non-job events
   "Next Job" appears at most once a day, and only today. */
function eventsFor(d){
  const k = key(d); if(cache[k]) return cache[k];
  const off = Math.round((d - TODAY)/DAY);
  let ev = [];
  if(off===0){
    ev = [mk('slate',7,8,null,'Morning Check-in'),mk('grey',8,9.5,'Ava Davis'),mk('yellow',9.75,10.5),mk('green',10.75,12,'Sophia Williams'),mk('brk',12.25,12.75),
          mk('dispatched',13,14.5,'Noah Johnson','Thermostat Calibration'),mk('nextjob',14.75,16.25,'Liam Thompson','Duct Cleaning Service'),
          mk('blue',16.5,17.75,'Mason Brown','Air Conditioning Check-Up'),mk('canceled',18,19,'Ella Martinez')];
    ev[1].tags = true; ev[5].tags = true; ev.forEach(x=>x.addr=ADDR[0]);
  } else if(off===2){
    // Thursday Oct 15: 2:00-3:00 PM is deliberately free (usability-test task: add a 2:00 PM appointment)
    ev=[mk('slate',7,8.5,null,'Meeting with team'),mk('blue',9,10,'Ethan Park','Thermostat Calibration'),mk('blue',9,10,'Olivia Reed','Cooling Tune Up'),
        mk('slate',11,12.5,null,'Meeting with team'),mk('blue',13,14,'Noah Johnson','Roof Inspection & Estimate'),mk('blue',15,16.5,'Liam Carter','Cooling Tune Up')];
  } else {
    const dw = d.getDay(); if(dw===0||dw===6) return cache[k]=[];
    const seed = (d.getDate()*7+d.getMonth()*3)%5;
    const kinds = off<0 ? ['grey','grey','slate','grey','canceled'] : ['blue','blue','slate','orange','blue','canceled'];
    const n = 2+seed%3;
    for(let i=0;i<n;i++){
      const sl=SLOTS[(seed+i)%SLOTS.length], kind=kinds[(seed+i*2)%kinds.length];
      ev.push(mk(kind,sl[0],sl[1],null,kind==='slate'?null:JOBT[(seed+i*3)%JOBT.length]));
    }
    if(off===1){ ev=ev.filter(x=>!(x.start<8&&x.end>7)); ev.push(mk('slate',7,8,null,'Vehicle Check-In')); }
    if(off===2) ev.push(mk('blue',9,10,null,'Thermostat Calibration'),mk('blue',9,10,null,'Cooling Tune Up'));   // two overlapping jobs
    ev.sort((a,b)=>a.start-b.start);
  }
  return cache[k]=ev;
}
function pack(ev){
  const out = ev.map(e=>({e,col:0,n:1})).sort((a,b)=>a.e.start-b.e.start);
  let group=[],end=-1;
  const flush=()=>{const n=Math.max(...group.map(g=>g.col))+1;group.forEach(g=>g.n=n);group=[]};
  for(const g of out){
    if(group.length && g.e.start>=end){flush();end=-1;}
    const used = group.filter(x=>x.e.end>g.e.start).map(x=>x.col);
    let c=0; while(used.includes(c)) c++;
    g.col=c; group.push(g); end=Math.max(end,g.e.end);
  }
  if(group.length) flush();
  return out;
}

/* ---------- month picker ---------- */
function busyDots(d){
  const n=eventsFor(d).filter(e=>e.type==='job').length; if(!n) return '';
  return `<span class="busy">${'<i></i>'.repeat(Math.min(n,2))}${n>2?'<b>+</b>':''}</span>`;
}
function renderPicker(){
  const p=$('#picker'); const isMonth=state.view==='month';
  const open = isMonth ? state.monthPills : state.pickerOpen;
  p.classList.toggle('open',open); p.classList.toggle('monly',isMonth);
  $('#chev').style.transform = open?'rotate(180deg)':'';
  const s=state.sel, first=new Date(s.getFullYear(),s.getMonth(),1), start=addDays(first,-first.getDay());
  let h=DOW.map(x=>`<div class="h">${x[0]}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i); if(i>=35 && d.getMonth()!==s.getMonth()) break;
    const out=d.getMonth()!==s.getMonth();
    h+=`<button data-d="${d.getTime()}" class="${sameDay(d,s)&&!out?'sel':''} ${out?'out':''}"><span>${d.getDate()}${out?'':busyDots(d)}</span></button>`;

  $('#pills').innerHTML=`<span class="pill year">${s.getFullYear()}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg></span>`+MON.map((m,i)=>`<button class="pill ${i===s.getMonth()?'on':''}" data-m="${i}">${m.slice(0,3)}</button>`).join('');
}

function renderTimeline(mode,cal,date){
  const days = mode==='day'?[date]:mode==='three'?[0,1,2].map(i=>addDays(date,i)):[0,1,2,3,4,5,6].map(i=>addDays(date,i-date.getDay()));
  const HH = 71, gutter = mode==='day'?46:51;

let evf=null;
const fmtLong=d=>`${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const fmtDur=h=>{ const m=Math.round(h*60), hh=Math.floor(m/60), mm=m%60; return (hh?hh+'h':'')+(hh&&mm?' ':'')+(mm?mm+'m':''); };
const DURS=[0.25,0.5,0.75,1,1.5,2,3,4];
function openEvent(start){
  evf={date:new Date(state.sel), name:'', start:start!=null?start:null, end:start!=null?start+0.5:null, ts:null, vis:null, memo:''};
  renderEvent();
  requestAnimationFrame(()=>requestAnimationFrame(()=>modal.classList.add('open')));
}
function closeEvent(){
  modal.classList.remove('open'); closePick(); closeDisc();
  setTimeout(()=>{ mroot.innerHTML=''; clearSlot(); evf=null; },340);
}
function evOverlap(){
  if(!evf.date||evf.start==null||evf.end==null||evf.end<=evf.start) return '';
  const hit=(eventsFor(evf.date)||[]).find(e=>e.start<evf.end&&e.end>evf.start);
  return hit?`<div class="banner" role="status">This event overlaps with ${hit.title}, ${fmtH(hit.start)} - ${fmtH(hit.end)}.</div>`:'';
}
function evReady(){ return evf.name.trim()&&evf.date&&evf.start!=null&&evf.end!=null&&evf.end>evf.start; }
function sel(key,label,ph,val){
  return `<button class="fld" data-e="field" data-k="${key}"><span class="lb">${label}</span><span class="inp">${val?`<span class="val">${val}</span>`:`<span class="ph">${ph}</span>`}${CHEV}</span></button>`;
}
function renderEvent(keepScroll){
  const prev=mroot.querySelector('.mbody'), top=prev?prev.scrollTop:0;
  const dur=(evf.start!=null&&evf.end!=null&&evf.end>evf.start)?fmtDur(evf.end-evf.start):null;
  mroot.innerHTML=`<div class="mhead"><div class="bar">Add Non-Job Event<button class="cancel" data-e="cancel">Cancel</button></div></div>
    <div class="mbody"><div class="fm evf" style="gap:var(--sp-6);padding-top:var(--sp-5)">
      <div class="sec">
        <label class="fld"><span class="lb">Event Name<u>*</u></span><span class="inp sm"><input id="evName" type="text" placeholder="Enter event name" value="${evf.name.replace(/"/g,'&quot;')}"></span></label>
        <div class="fld"><span class="lb">Date<u>*</u></span><div class="dt one"><button class="r" data-e="field" data-k="date"><span>Date</span><span class="badge">${fmtLong(evf.date)}</span></button></div></div>

          <button class="r" data-e="field" data-k="end"><span>End</span><span class="badge">${evf.end!=null?fmtH(evf.end):'Select Time'}</span></button>
          <button class="r" data-e="field" data-k="dur"><span>Duration</span><span class="badge">${dur||'Set Duration'}</span></button></div>
          ${evOverlap()}</div>
        ${sel('ts','Timesheet Code','Select Timesheet Code',evf.ts)}
        ${sel('vis','Visibility Flags','Select Visibility Flags',evf.vis)}
        <label class="fld"><span class="lb">Memo</span><span class="inp" style="height:60px;align-items:flex-start;padding-top:var(--sp-3)"><input id="evMemo" type="text" placeholder="Enter Memo" value="${evf.memo.replace(/"/g,'&quot;')}"></span></label>
      </div>
    </div></div>
    <div class="sticky"><div class="acts"><button class="abtn ${evReady()?'on':''}" data-e="add">Add Non-Job Event</button></div><div class="hi"><i></i></div></div>`;
  if(keepScroll) mroot.querySelector('.mbody').scrollTop=top;
}
function openDisc(){ $('#discScrim').classList.add('open'); $('#discSheet').classList.add('open'); }
function closeDisc(){ $('#discScrim').classList.remove('open'); $('#discSheet').classList.remove('open'); }
$('#discScrim').onclick=closeDisc; $('#discNo').onclick=closeDisc;
$('#discYes').onclick=()=>{ closeDisc(); if(evf) closeEvent(); };
modal.addEventListener('input',e=>{
  if(!evf) return;
  if(e.target.id==='evName'){ evf.name=e.target.value; const b=mroot.querySelector('[data-e="add"]'); if(b) b.classList.toggle('on',!!evReady()); }
  if(e.target.id==='evMemo') evf.memo=e.target.value;
});
modal.addEventListener('click',e=>{
  const b=e.target.closest('[data-e]'); if(!b||!evf) return;
  const m=b.dataset.e;
  if(m==='cancel') openDisc();
  else if(m==='field'){
    const k=b.dataset.k, ts=[]; for(let h=START;h<END+0.5;h+=0.5) ts.push(h);
    if(k==='date'){
      const days=[0,1,2,3,4,5,6].map(i=>addDays(TODAY,i));
      openPick('Date',days.map(fmtLong),fmtLong(evf.date),v=>{ evf.date=days.find(d=>fmtLong(d)===v); renderEvent(true); });
    } else if(k==='start'){
      openPick('Start Time',ts.map(fmtH),evf.start!=null&&fmtH(evf.start),v=>{ const len=(evf.end!=null&&evf.start!=null&&evf.end>evf.start)?evf.end-evf.start:0.5; evf.start=ts.find(h=>fmtH(h)===v); evf.end=evf.start+len; renderEvent(true); });
    } else if(k==='end'){
      openPick('End Time',ts.map(fmtH),evf.end!=null&&fmtH(evf.end),v=>{ evf.end=ts.find(h=>fmtH(h)===v); renderEvent(true); });
    } else if(k==='dur'){
      const cur=(evf.end>evf.start)?fmtDur(evf.end-evf.start):null;
      openPick('Duration',DURS.map(fmtDur),cur,v=>{ const d=DURS.find(x=>fmtDur(x)===v); if(evf.start==null) evf.start=9; evf.end=evf.start+d; renderEvent(true); });
    } else if(k==='ts') openPick('Timesheet Code',['Training','Admin','Travel','Shop time'],evf.ts,v=>{ evf.ts=v; renderEvent(true); });
    else if(k==='vis') openPick('Visibility Flags',['Everyone','Dispatch only','Only me'],evf.vis,v=>{ evf.vis=v; renderEvent(true); });
  }
  else if(m==='add'){
    if(!evReady()) return;
    const ev={id:++uid,style:'slate',title:evf.name.trim(),type:'break',start:evf.start,end:evf.end,who:'',addr:''};
    const list=eventsFor(evf.date); list.push(ev); list.sort((a,b)=>a.start-b.start);
    state.view='day'; state.sel=new Date(evf.date); state.pickerOpen=false;
    clearSlot(); render();
    const cal=stage.querySelector('.cal'); if(cal) cal.scrollTop=Math.max(0,(ev.start-START-1.5)*71);
    closeEvent();
  }
});

function openSearch(){
  sq={q:'',st:'empty',timer:null,errOnce:false}; sinp.value=''; $('#sClear').classList.remove('on'); closeDR();
  $('#sjob').classList.remove('open'); setSState('empty');
  srch.classList.add('open'); setTimeout(()=>sinp.focus(),80);
}
function closeSearch(){ srch.classList.remove('open'); $('#sjob').classList.remove('open'); clearTimeout(sq.timer); sinp.blur(); }
function sstate(img,w,h,title,body,btn,mid){
  return `<div class="sstate ${mid?'mid':''}">${img==='spin'?SPIN:`<img src="${ILL[img]}" width="${w}" height="${h}" alt="">`}<div class="tx"><h2>${title}</h2><p>${body}</p></div>${btn?`<button class="pbtn" data-s="${btn[1]}">${btn[0]}</button>`:''}</div>`;
}
function jobCard(j){
  const chk=j.st==='Confirmed'?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>':'';
  return `<button class="jc" data-s="job" data-no="${j.no}"><div><div class="t1"><span class="no">Job #${j.no}</span><span class="st" style="background:var(${STCOL[j.st]})">${chk}${j.st}</span></div><div class="tt">${j.t}</div></div>

}
function resultsHTML(list){
  const groups={}; list.forEach(j=>{ const k=j.d.join('-'); (groups[k]=groups[k]||[]).push(j); });
  const keys=Object.keys(groups).sort((a,b)=>new Date(...b.split('-').map(Number))-new Date(...a.split('-').map(Number)));
  return '<div class="sr-list">'+keys.map(k=>{ const d=new Date(...k.split('-').map(Number));
    return `<div class="sr-grp"><div class="sr-date"><div class="dd">${MON[d.getMonth()].slice(0,3)}<b>${d.getDate()}</b>${DOW[d.getDay()]}</div><i></i></div><div class="sr-cards">${groups[k].map(jobCard).join('')}</div></div>`; }).join('')+'</div>';
}
function setSState(st,list){
  sq.st=st;
  const h={
    empty:()=>sstate('empty',180,127,'Search for a job','Enter a job number, customer name, or address.'),
    loading:()=>sstate('spin',0,0,'Loading...','Please wait a moment while we fetch the jobs for you.',null,true),
    noresults:()=>sstate('noresults',180,84,'No results found','Check your spelling or try a different job number, customer name, or address.'),
    error:()=>sstate('error',185,110,"Couldn't load jobs","We couldn't load the jobs. Try loading them again.",['Try Again','retry']),
    offline:()=>sstate('offline',180,98,'No offline loading','Connect to the internet to search jobs.',['Go Back','back'],true),
    results:()=>resultsHTML(list||[])
  };
  sm.innerHTML=h[st](); sm.scrollTop=0;
}
function runSearch(){
  const q=sq.q.trim().toLowerCase();
  if(!navigator.onLine||q==='offline') return setSState('offline');
  if(q==='error'&&!sq.errOnce) return setSState('error');
  const inRange=j=>{ const d=new Date(...j.d); return d>=dayOnly(sdr.start)&&d<=dayOnly(sdr.end); };
  const list=(q==='error'?SJOBS:SJOBS.filter(j=>(j.no+' '+j.t+' '+j.c+' '+j.a+' '+j.loc).toLowerCase().includes(q))).filter(inRange);
  setSState(list.length?'results':'noresults',list);
}
function queueSearch(){ clearTimeout(sq.timer); setSState('loading'); sq.timer=setTimeout(runSearch,750); }
sinp.addEventListener('input',()=>{
  sq.q=sinp.value; $('#sClear').classList.toggle('on',!!sinp.value);
  clearTimeout(sq.timer);
  if(sq.q.trim().length<2){ setSState('empty'); return; }
  queueSearch();
});
sinp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&sq.q.trim().length>=2){ e.preventDefault(); sinp.blur(); queueSearch(); } });
$('#sClear').onclick=()=>{ sinp.value=''; sq.q=''; $('#sClear').classList.remove('on'); clearTimeout(sq.timer); setSState('empty'); sinp.focus(); };
$('#sCancel').onclick=closeSearch;
$('#searchBtn').onclick=openSearch;
sm.addEventListener('click',e=>{
  const b=e.target.closest('[data-s]'); if(!b) return;
  const a=b.dataset.s;
  if(a==='retry'){ sq.errOnce=true; queueSearch(); }
  else if(a==='back') closeSearch();
  else if(a==='job'){ const j=SJOBS.find(x=>x.no===b.dataset.no); if(j) openSJob(j); }
});

function drBounds(){

function calHTML(){
  const {min,max}=drBounds(), cur=dayOnly(dr[dr.active]);
  const v=dr.view, first=new Date(v.getFullYear(),v.getMonth(),1), n=new Date(v.getFullYear(),v.getMonth()+1,0).getDate();
  const prevOk=first>new Date(min.getFullYear(),min.getMonth(),1), nextOk=new Date(v.getFullYear(),v.getMonth()+1,1)<=new Date(max.getFullYear(),max.getMonth(),1);
  let g=DOW.map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<first.getDay();i++) g+='<span></span>';
  for(let d=1;d<=n;d++){
    const dt=new Date(v.getFullYear(),v.getMonth(),d), off=dt<dayOnly(min)||dt>dayOnly(max);
    g+=`<button data-d="${dt.getTime()}" class="${sameDay(dt,cur)?'sel':''}" ${off?'disabled':''} aria-label="${fmtShort(dt)}"><span>${d}</span></button>`;
  }
  return `<div class="dr-cal"><div class="dr-nav"><button class="ttl" data-dr="year">${MON[v.getMonth()]} ${v.getFullYear()}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <div class="ar"><button data-dr="prev" ${prevOk?'':'disabled'} aria-label="Previous month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><button data-dr="next" ${nextOk?'':'disabled'} aria-label="Next month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button></div></div>
    <div class="dr-grid">${g}</div></div>`;
}

// URL state so Maze (and start links) can see/seed the view + date: ?view=day|3day|week|month&date=YYYY-MM-DD
const VIEW_ALIAS={day:'day','1':'day','3':'three','3day':'three','3days':'three',three:'three',week:'week','7':'week','7day':'week',month:'month'};
const URL_VIEW={day:'day',three:'3day',week:'week',month:'month'};
try{
  const q=new URLSearchParams(location.search);
  const v=VIEW_ALIAS[(q.get('view')||'').toLowerCase()]; if(v) state.view=v;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(q.get('date')||''); if(m) state.sel=new Date(+m[1],+m[2]-1,+m[3]);
}catch(e){}
const _render=render;
render=function(){ _render.apply(this,arguments);
  try{ const q=new URLSearchParams(); q.set('view',URL_VIEW[state.view]); q.set('date',state.sel.getFullYear()+'-'+String(state.sel.getMonth()+1).padStart(2,'0')+'-'+String(state.sel.getDate()).padStart(2,'0'));
    history.replaceState(null,'','?'+q.toString()); }catch(e){}
};
render();
